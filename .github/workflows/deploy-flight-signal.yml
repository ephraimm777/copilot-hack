name: Deploy Flight Signal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-flight-signal.yml'
      - 'possible-solution/client/**'
      - 'possible-solution/server/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: possible-solution/server/.python-version
          cache: pip
          cache-dependency-path: possible-solution/server/requirements.txt

      - name: Install model dependencies and export forecasts
        working-directory: possible-solution/server
        run: |
          python -m pip install -r requirements.txt
          python export_forecasts.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: possible-solution/client/.node-version
          cache: npm
          cache-dependency-path: possible-solution/client/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: possible-solution/client
        run: npm ci

      - name: Build static website
        working-directory: possible-solution/client
        run: npm run check && npm run build
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: possible-solution/client/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
